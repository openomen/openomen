# .github/workflows/release.yml
# Builds the CLI binary on Ubuntu 22.04 (glibc 2.35) and creates a DRAFT release
# whenever a tag like CLI_0.5.1 is pushed. Review the notes, then press Publish.
name: Release CLI

on:
  push:
    tags: ["CLI_*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Check tag matches VERSION
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#CLI_}"
          TAG_VERSION="${TAG_VERSION#v}"
          CODE_VERSION=$(python -c "import sys; sys.path.insert(0, 'src'); from openomen import VERSION; print(VERSION)")
          echo "tag=$TAG_VERSION code=$CODE_VERSION"
          if [ "$TAG_VERSION" != "$CODE_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION=$CODE_VERSION in src/openomen/__init__.py"
            exit 1
          fi

      - name: Build binary
        run: |
          python -m pip install --upgrade pip pyinstaller
          pyinstaller openomen.spec

      - name: Test binary
        run: |
          ./dist/openomen --version
          ./dist/openomen --version | grep -q "${GITHUB_REF_NAME#CLI_}"
          LIBPY=$(python -c "import sysconfig,os; print(os.path.join(sysconfig.get_config_var('LIBDIR'), sysconfig.get_config_var('LDLIBRARY')))")
          echo "Highest glibc needed (libpython):"
          objdump -T "$LIBPY" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1

      - name: Checksum
        run: |
          cd dist
          sha256sum openomen > openomen.sha256
          cat openomen.sha256

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/openomen dist/openomen.sha256 \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --draft